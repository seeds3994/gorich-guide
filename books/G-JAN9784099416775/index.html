<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一次的1000單字圖鑑｜SeedKidz 中文使用指南</title></head>
<body style="margin:0;background:#fdfcf9;color:#414936;font:17px/1.8 sans-serif">
<main style="max-width:680px;margin:15vh auto;padding:20px;text-align:center" id="loading">SeedKidz 喜禾童屋｜中文使用指南載入中…</main>
<script>
(async()=>{
  try{
    const count=21;
    const files=Array.from({length:count},(_,i)=>'./_content/part-'+String(i).padStart(3,'0')+'.txt');
    const pieces=await Promise.all(files.map(async file=>{
      const resp=await fetch(file,{cache:'no-cache'});
      if(!resp.ok)throw new Error('HTTP '+resp.status+' '+file);
      return resp.text();
    }));
    const html=pieces.join('');
    if(!html.includes('Zgs9ZC0JIF8')||!html.includes('</body></html>'))throw new Error('指南內容不完整');
    document.open();document.write(html);document.close();
  }catch(err){
    document.querySelector('#loading').textContent='指南暫時無法載入，請重新整理頁面。';
    console.error('SeedKidz guide:',err);
  }
})();
</script></body></html>
